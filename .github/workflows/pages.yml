name: Publicar Web V2 en GitHub Pages

on:
  push:
    branches:
      - main
      - feat/home-v2-premium
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v2
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://izc05.github.io/isivoltpro-web-v2' }}
  PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/isivoltpro-web-v2/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Restaurar vídeo Hero
        run: |
          mkdir -p public/video
          cat \
            build-assets/hero-home-deploy/part-00.b64 \
            build-assets/hero-home-deploy/part-01.b64 \
            build-assets/hero-home-deploy/part-02-03.b64 \
            build-assets/hero-home-deploy/part-04-05.b64 \
            build-assets/hero-home-deploy/part-06-07.b64 \
            build-assets/hero-home-deploy/part-08-09.b64 \
            | base64 --decode > public/video/hero-home.mp4
          test "$(wc -c < public/video/hero-home.mp4)" -eq 653417
          echo "74893dc8505bce7de756e976658685423e2d8615f707f1425690ceddebe68c1b  public/video/hero-home.mp4" | sha256sum -c -
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
