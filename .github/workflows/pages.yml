name: Publicar Web V2 en GitHub Pages

on:
  push:
    branches:
      - main
      - feat/home-rebuild-approved
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v2
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://izc05.github.io/isivoltpro-web-v2' }}
  PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/isivoltpro-web-v2/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
